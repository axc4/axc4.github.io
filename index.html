<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cyber Anarchy</title>
<style>
  :root {
    --bg: #fff;
    --fg: #000;
    --muted: #444;
  }
  :root[data-theme="dark"] {
    --bg: #000;
    --fg: #fff;
    --muted: #aaa;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top, 0px));
    padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  }
  .wrap {
    width: 100%;
    max-width: 600px;
    text-align: center;
  }
  .topRow {
    display: flex;
    justify-content: flex-end;
    max-width: 600px;
    width: 100%;
    margin: 0 auto 8px;
  }
  #themeToggle {
    font-family: monospace;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--fg);
    padding: 2px 8px;
    cursor: pointer;
  }
  h1 {
    font-size: 1rem;
    font-weight: normal;
    margin: 0 0 4px;
  }
  p {
    font-size: 0.85rem;
    margin: 0 0 12px;
    color: var(--muted);
  }
  textarea {
    width: 100%;
    height: 300px;
    font-family: monospace;
    font-size: 1rem;
    display: block;
    margin: 0 auto;
    text-align: left;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--fg);
  }
  button {
    font-family: monospace;
    margin-top: 8px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--fg);
    padding: 4px 10px;
    cursor: pointer;
  }
  #status, #meta, #counter {
    font-size: 0.8rem;
    display: block;
    margin-top: 4px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="topRow">
    <button id="themeToggle">dark mode</button>
  </div>
  <div class="wrap">
    <h1>cyber anarchy</h1>
    <p>shared plain-text page. anyone can edit, delete, or replace anything. autosaves 2s after you stop typing.</p>

    <textarea id="shared" spellcheck="false" maxlength="5000"></textarea>
    <span id="counter">0 / 5000</span>
    <button id="saveButton">save for everyone</button>
    <span id="status"></span>
    <span id="meta"></span>
  </div>

  <script>
    // theme toggle: intentionally independent of the Firebase module below,
    // so it still works even if that import fails or is slow to load.
    (function () {
      const toggle = document.querySelector("#themeToggle");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        toggle.textContent = theme === "dark" ? "light mode" : "dark mode";
      }

      let currentTheme = "light";
      try {
        const saved = localStorage.getItem("cyberAnarchyTheme");
        if (saved) currentTheme = saved;
      } catch (e) {}
      applyTheme(currentTheme);

      toggle.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
        try { localStorage.setItem("cyberAnarchyTheme", currentTheme); } catch (e) {}
      });
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsEMjq8Z1tDgwwyfLJ1S0julbcDtHgjSY",
      authDomain: "total-anarchy.firebaseapp.com",
      projectId: "total-anarchy",
      storageBucket: "total-anarchy.firebasestorage.app",
      messagingSenderId: "774274833340",
      appId: "1:774274833340:web:a8782941bd5ba9b334a9b9",
      measurementId: "G-6JC8ZGEPJN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const sharedPage = doc(db, "public", "main");

    const editor = document.querySelector("#shared");
    const counter = document.querySelector("#counter");
    const saveButton = document.querySelector("#saveButton");
    const status = document.querySelector("#status");
    const meta = document.querySelector("#meta");

    let myName = "anon-" + Math.floor(Math.random() * 10000);
    try {
      const saved = localStorage.getItem("cyberAnarchyNick");
      if (saved) myName = saved;
    } catch (e) {}

    function updateCounter() {
      counter.textContent = `${editor.value.length} / 5000`;
    }
    editor.addEventListener("input", updateCounter);
    updateCounter();

    onSnapshot(
      sharedPage,
      snapshot => {
        if (!snapshot.exists()) {
          status.textContent = "no saved version yet.";
          return;
        }
        const data = snapshot.data();
        const incomingText = data.text || "";
        if (document.activeElement !== editor && incomingText !== editor.value) {
          editor.value = incomingText;
          updateCounter();
        }
        status.textContent = "loaded shared version.";
        if (data.editor && data.changedAt) {
          meta.textContent = `last touched by ${data.editor} at ${new Date(data.changedAt).toLocaleTimeString()}`;
        }
      },
      error => {
        console.error(error);
        status.textContent = "could not connect to database.";
      }
    );

    let lastSaveAt = 0;
    const MIN_SAVE_INTERVAL_MS = 2000;

    async function doSave(text) {
      const now = Date.now();
      if (now - lastSaveAt < MIN_SAVE_INTERVAL_MS) {
        status.textContent = "slow down — saving too fast.";
        return;
      }
      try {
        saveButton.disabled = true;
        status.textContent = "saving...";
        await setDoc(sharedPage, {
          text: text.slice(0, 5000),
          changedAt: now,
          editor: myName
        });
        lastSaveAt = now;
        status.textContent = "saved for everyone.";
      } catch (error) {
        console.error(error);
        status.textContent = "save failed.";
      } finally {
        saveButton.disabled = false;
      }
    }

    saveButton.addEventListener("click", () => doSave(editor.value));

    let autosaveTimer = null;
    editor.addEventListener("input", () => {
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => doSave(editor.value), 2000);
    });
  </script>
</body>
</html>
